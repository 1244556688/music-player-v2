<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Win11 x macOS 極簡動態背景音樂播放器</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    animation: {
                        'spin-slow': 'spin 12s linear infinite',
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(150, 150, 150, 0.3); border-radius: 9999px; }

        input[type=range] { -webkit-appearance: none; background: transparent; }
        input[type=range]:focus { outline: none; }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 4px; cursor: pointer; border-radius: 2px;
        }
        input[type=range]::-webkit-slider-thumb {
            height: 14px; width: 14px; border-radius: 50%; background: #ffffff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3); cursor: pointer; -webkit-appearance: none;
            margin-top: -5px; transition: transform 0.1s ease;
        }
        input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.25); }

        /* GPU 硬體加速，防止黑塊與閃爍 */
        .gpu-accelerated {
            transform: translateZ(0);
            backface-visibility: hidden;
            perspective: 1000px;
        }

        .glass-card {
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
        }

        .vinyl-paused {
            animation-play-state: paused;
        }

        /* 登出按鈕懸停特效 */
        .logout-btn-group:hover .logout-btn-icon { opacity: 1; }
        .logout-btn-icon { opacity: 0; font-size: 7px; transition: opacity 0.2s; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body class="bg-slate-100 dark:bg-zinc-950 text-slate-900 dark:text-slate-100 min-h-screen flex items-center justify-center p-4 sm:p-6 font-sans relative overflow-hidden select-none transition-colors duration-300">

    <!-- 🌌 全螢幕動態流光背景 -->
    <div class="fixed inset-0 pointer-events-none z-0 overflow-hidden gpu-accelerated">
        <div id="bgBlob1" class="absolute -top-20 -left-20 w-96 h-96 bg-indigo-500/30 dark:bg-indigo-600/40 rounded-full blur-[60px] transition-transform duration-100 ease-out will-change-transform"></div>
        <div id="bgBlob2" class="absolute top-1/2 -right-20 w-96 h-96 bg-purple-500/30 dark:bg-purple-600/40 rounded-full blur-[70px] transition-transform duration-100 ease-out will-change-transform"></div>
        <div id="bgBlob3" class="absolute -bottom-20 left-1/3 w-96 h-96 bg-pink-500/20 dark:bg-pink-600/30 rounded-full blur-[65px] transition-transform duration-100 ease-out will-change-transform"></div>
        
        <!-- 背景律動線條 Canvas -->
        <canvas id="bgCanvas" class="absolute inset-0 w-full h-full opacity-60 block"></canvas>
    </div>

    <!-- 隱藏的上傳 Input -->
    <input type="file" id="audioFileInput" accept="audio/*" multiple class="hidden">

    <!-- 主播放器面板（支援深淺色 toggle） -->
    <div id="playerWindow" class="relative z-10 w-full max-w-md rounded-3xl overflow-hidden shadow-2xl border border-white/60 dark:border-white/10 glass-card bg-white/70 dark:bg-zinc-900/70 text-zinc-800 dark:text-zinc-100 transition-all duration-300 ease-in-out gpu-accelerated">
        
        <!-- macOS 風格標題列 -->
        <div class="flex items-center justify-between px-5 py-3.5 border-b border-black/10 dark:border-white/10 bg-black/5 dark:bg-black/20">
            <div class="flex items-center space-x-2 logout-btn-group">
                <!-- 紅色按鈕：點擊登出 / 返回登入頁面 -->
                <button onclick="handleLogout()" class="w-3 h-3 rounded-full bg-red-500 hover:bg-red-600 transition-transform hover:scale-110 flex items-center justify-center text-black/70 cursor-pointer" title="登出帳號">
                    <i class="fa-solid fa-power-off logout-btn-icon"></i>
                </button>
                <button class="w-3 h-3 rounded-full bg-amber-400 hover:bg-amber-500 transition-transform hover:scale-110" title="最小化"></button>
                <button id="fullscreenBtn" class="w-3 h-3 rounded-full bg-emerald-500 hover:bg-emerald-600 transition-transform hover:scale-125 cursor-pointer" title="全螢幕"></button>
            </div>

            <div class="text-xs font-medium tracking-wide opacity-80 flex items-center gap-1.5">
                <i class="fa-solid fa-user text-indigo-500 dark:text-indigo-400"></i>
                <span id="displayUsername">載入中...</span>
            </div>

            <div class="flex items-center space-x-2 sm:space-x-3">
                <button id="uploadBtn" class="text-xs px-2.5 py-1 rounded-lg bg-indigo-500/10 hover:bg-indigo-500/20 dark:bg-indigo-500/20 dark:hover:bg-indigo-500/30 text-indigo-600 dark:text-indigo-300 flex items-center gap-1.5 font-medium border border-indigo-500/30 transition-all" title="上傳音樂">
                    <i class="fa-solid fa-cloud-arrow-up"></i>
                    <span class="text-[11px]">上傳音樂</span>
                </button>
                <!-- ☀️/🌙 深淺色切換按鈕 -->
                <button id="themeToggle" class="text-xs opacity-70 hover:opacity-100 p-1.5 rounded-lg hover:bg-black/5 dark:hover:bg-white/10 transition-colors">
                    <i id="themeIcon" class="fa-solid fa-moon"></i>
                </button>
                <button id="playlistToggle" class="text-xs opacity-70 hover:opacity-100 p-1.5 rounded-lg hover:bg-black/5 dark:hover:bg-white/10 transition-colors" title="播放清單">
                    <i class="fa-solid fa-list-ul"></i>
                </button>
            </div>
        </div>

        <!-- 主體區域：左右雙欄 -->
        <div class="flex flex-col md:flex-row items-stretch">
            
            <!-- 左側：控制區 -->
            <div class="p-6 flex flex-col items-center flex-1 min-w-[300px] sm:min-w-[340px]">
                
                <!-- 黑膠與頻譜面板 -->
                <div class="relative w-full my-2 flex flex-col items-center">
                    <div class="relative w-36 h-36 sm:w-40 sm:h-40 rounded-full flex items-center justify-center my-2 shadow-2xl">
                        <div id="vinylGlow" class="absolute -inset-2 rounded-full bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 blur-md opacity-70 transition-all duration-75 will-change-transform"></div>
                        
                        <div id="vinylDisk" class="relative w-full h-full rounded-full bg-zinc-900 border-4 border-zinc-800 shadow-inner flex items-center justify-center animate-spin-slow vinyl-paused">
                            <div class="w-3/4 h-3/4 rounded-full border border-zinc-700/40 flex items-center justify-center">
                                <div class="w-1/2 h-1/2 rounded-full border border-zinc-700/60 flex items-center justify-center">
                                    <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-indigo-600 to-pink-500 flex items-center justify-center shadow-md">
                                        <i class="fa-solid fa-music text-white text-xs"></i>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 即時頻譜條 -->
                    <div class="w-full mt-4 px-1">
                        <div class="flex items-center justify-between text-[10px] font-semibold tracking-wider text-zinc-500 dark:text-zinc-400 uppercase mb-1">
                            <span><i class="fa-solid fa-chart-simple text-indigo-500 dark:text-indigo-400 mr-1.5"></i>即時聲頻頻譜</span>
                            <span class="text-[9px] px-2 py-0.5 rounded-full bg-indigo-500/10 dark:bg-indigo-500/20 text-indigo-600 dark:text-indigo-300 border border-indigo-500/30">Live Visualizer</span>
                        </div>
                        <div class="w-full h-20 bg-zinc-200/60 dark:bg-zinc-950/80 rounded-2xl p-2 border border-black/5 dark:border-white/10 backdrop-blur-md flex items-center justify-center overflow-hidden">
                            <canvas id="spectrumCanvas" class="w-full h-full block"></canvas>
                        </div>
                    </div>
                </div>

                <!-- 曲目資訊 -->
                <div class="w-full text-center mt-3 mb-2">
                    <h2 id="songTitle" class="text-xl sm:text-2xl font-bold tracking-tight truncate text-zinc-800 dark:text-zinc-100">Midnight Breeze</h2>
                    <p id="artistName" class="text-xs sm:text-sm text-zinc-500 dark:text-zinc-400 font-medium truncate mt-0.5">Lofi Chillout Lounge</p>
                </div>

                <!-- 進度條 -->
                <div class="w-full space-y-1.5 my-3">
                    <input type="range" id="progressBar" min="0" max="100" value="0" class="w-full h-1.5 bg-zinc-300 dark:bg-zinc-700/60 rounded-lg appearance-none cursor-pointer accent-indigo-600 dark:accent-indigo-500">
                    <div class="flex justify-between text-[11px] font-mono text-zinc-500 dark:text-zinc-400 font-medium px-0.5">
                        <span id="currentTime">0:00</span>
                        <span id="totalTime">0:00</span>
                    </div>
                </div>

                <!-- 控制按鈕 -->
                <div class="flex items-center justify-between w-full max-w-xs mb-4">
                    <button id="shuffleBtn" class="text-zinc-400 hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors p-2 text-sm" title="隨機播放">
                        <i class="fa-solid fa-shuffle"></i>
                    </button>

                    <button id="prevBtn" class="p-3 text-zinc-700 dark:text-zinc-200 hover:scale-110 active:scale-95 transition-all text-lg">
                        <i class="fa-solid fa-backward-step"></i>
                    </button>

                    <button id="playBtn" class="w-14 h-14 rounded-full bg-indigo-600 hover:bg-indigo-500 text-white shadow-lg shadow-indigo-500/30 flex items-center justify-center text-xl hover:scale-105 active:scale-95 transition-all">
                        <i id="playIcon" class="fa-solid fa-play ml-0.5"></i>
                    </button>

                    <button id="nextBtn" class="p-3 text-zinc-700 dark:text-zinc-200 hover:scale-110 active:scale-95 transition-all text-lg">
                        <i class="fa-solid fa-forward-step"></i>
                    </button>

                    <button id="repeatBtn" class="text-zinc-400 hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors p-2 text-sm" title="單曲循環">
                        <i class="fa-solid fa-repeat"></i>
                    </button>
                </div>

                <!-- 音量條 -->
                <div class="flex items-center space-x-3 w-full max-w-xs bg-black/5 dark:bg-zinc-800/40 px-4 py-2 rounded-xl border border-black/5 dark:border-white/10">
                    <button id="muteBtn" class="text-zinc-500 dark:text-zinc-400 hover:text-zinc-800 dark:hover:text-zinc-200 transition-colors">
                        <i id="volumeIcon" class="fa-solid fa-volume-high text-xs"></i>
                    </button>
                    <input type="range" id="volumeBar" min="0" max="100" value="80" class="w-full h-1 bg-zinc-300 dark:bg-zinc-600 rounded-lg appearance-none cursor-pointer accent-indigo-600 dark:accent-indigo-500">
                </div>

            </div>

            <!-- 👉 右側：播放清單抽屜 -->
            <div id="playlistDrawer" class="w-0 opacity-0 max-h-0 md:max-h-none overflow-hidden transition-all duration-300 ease-in-out bg-black/5 dark:bg-black/30 border-t md:border-t-0 md:border-l border-black/10 dark:border-white/10 flex flex-col">
                <div class="p-5 w-full md:w-80 flex flex-col h-full min-h-[420px]">
                    <div class="flex items-center justify-between mb-3 px-1">
                        <div class="text-xs font-semibold tracking-wider text-zinc-500 dark:text-zinc-400 uppercase">播放清單</div>
                        <button id="drawerUploadBtn" class="text-[11px] text-indigo-600 dark:text-indigo-400 hover:underline flex items-center gap-1">
                            <i class="fa-solid fa-plus"></i> 新增本地歌曲
                        </button>
                    </div>
                    <div id="playlistContainer" class="space-y-1.5 flex-1 max-h-[380px] overflow-y-auto pr-1"></div>
                </div>
            </div>

        </div>

    </div>

    <!-- 登入與登出狀態控制腳本 -->
    <script>
        // 初始化檢查登入狀態並顯示用戶名
        document.addEventListener('DOMContentLoaded', () => {
            const currentUser = localStorage.getItem('aura_current_user');
            const displayUsername = document.getElementById('displayUsername');
            if (currentUser) {
                displayUsername.textContent = currentUser;
            } else {
                displayUsername.textContent = "訪客";
            }
        });

        // 點擊 macOS 紅色按鈕登出並返回登入頁面 (假設你的登入頁叫做 login.html)
        function handleLogout() {
            localStorage.removeItem('aura_current_user');
            window.location.href = 'index.html';
        }
    </script>

    <script>
        const presetPlaylist = [
            
                title: "為自己吶喊",
                artist: "justin & suno",
                src: "./為自己吶喊.mp3",
                themeColors: ["#6366f1", "#a855f7", "#ec4899"]
            },
            {
                title: "passion",
                src: "passion.mp3",
                themeColors: ["#06b6d4", "#3b82f6", "#6366f1"]
            }
        ];

        let playlist = [...presetPlaylist];
        let currentTrackIndex = 0;
        let isPlaying = false;
        let isMuted = false;
        let isShuffle = false;
        let isRepeat = false;
        let isPlaylistOpen = false;

        const audio = new Audio();
        audio.crossOrigin = "anonymous";

        let audioCtx = null;
        let analyser = null;
        let sourceNode = null;

        const playerWindow = document.getElementById('playerWindow');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const playBtn = document.getElementById('playBtn');
        const playIcon = document.getElementById('playIcon');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const shuffleBtn = document.getElementById('shuffleBtn');
        const repeatBtn = document.getElementById('repeatBtn');
        const muteBtn = document.getElementById('muteBtn');
        const volumeIcon = document.getElementById('volumeIcon');
        const volumeBar = document.getElementById('volumeBar');
        const progressBar = document.getElementById('progressBar');
        const currentTimeEl = document.getElementById('currentTime');
        const totalTimeEl = document.getElementById('totalTime');
        const songTitle = document.getElementById('songTitle');
        const artistName = document.getElementById('artistName');
        const vinylDisk = document.getElementById('vinylDisk');
        const vinylGlow = document.getElementById('vinylGlow');
        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');
        const playlistToggle = document.getElementById('playlistToggle');
        const playlistDrawer = document.getElementById('playlistDrawer');
        const playlistContainer = document.getElementById('playlistContainer');
        const uploadBtn = document.getElementById('uploadBtn');
        const drawerUploadBtn = document.getElementById('drawerUploadBtn');
        const audioFileInput = document.getElementById('audioFileInput');
        
        const bgBlob1 = document.getElementById('bgBlob1');
        const bgBlob2 = document.getElementById('bgBlob2');
        const bgBlob3 = document.getElementById('bgBlob3');
        const spectrumCanvas = document.getElementById('spectrumCanvas');
        const specCtx = spectrumCanvas.getContext('2d');
        const bgCanvas = document.getElementById('bgCanvas');
        const bgCtx = bgCanvas.getContext('2d');

        // 深淺色切換機制
        themeToggle.addEventListener('click', () => {
            const html = document.documentElement;
            html.classList.toggle('dark');
            const isDark = html.classList.contains('dark');
            themeIcon.className = isDark ? "fa-solid fa-moon" : "fa-solid fa-sun";
        });

        fullscreenBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                document.exitFullscreen();
            }
        });

        let resizeTimer;
        playlistToggle.addEventListener('click', () => {
            isPlaylistOpen = !isPlaylistOpen;
            if (isPlaylistOpen) {
                playerWindow.classList.replace('max-w-md', 'md:max-w-3xl');
                playlistDrawer.classList.remove('w-0', 'opacity-0', 'max-h-0');
                playlistDrawer.classList.add('w-full', 'md:w-80', 'opacity-100', 'max-h-[500px]');
            } else {
                playerWindow.classList.replace('md:max-w-3xl', 'max-w-md');
                playlistDrawer.classList.add('w-0', 'opacity-0', 'max-h-0');
                playlistDrawer.classList.remove('w-full', 'md:w-80', 'opacity-100', 'max-h-[500px]');
            }
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(resizeCanvases, 320);
        });

        function resizeCanvases() {
            const specRect = spectrumCanvas.getBoundingClientRect();
            if (specRect.width > 0 && specRect.height > 0) {
                spectrumCanvas.width = Math.floor(specRect.width * (window.devicePixelRatio || 1));
                spectrumCanvas.height = Math.floor(specRect.height * (window.devicePixelRatio || 1));
            }
            bgCanvas.width = window.innerWidth;
            bgCanvas.height = window.innerHeight;
        }

        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(resizeCanvases, 100);
        });
        setTimeout(resizeCanvases, 50);

        function initAudioContext() {
            if (audioCtx) return;
            try {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContextClass();
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 64;
                sourceNode = audioCtx.createMediaElementSource(audio);
                sourceNode.connect(analyser);
                analyser.connect(audioCtx.destination);
            } catch (e) { console.warn(e); }
        }

        function drawSpectrum() {
            requestAnimationFrame(drawSpectrum);
            const w = spectrumCanvas.width;
            const h = spectrumCanvas.height;
            if (w === 0 || h === 0) return;

            specCtx.clearRect(0, 0, w, h);

            const barCount = 32;
            const barWidth = (w / barCount) * 0.6;
            const gap = (w / barCount) * 0.4;
            let dataArray = new Uint8Array(barCount);

            if (analyser && isPlaying) {
                const fullData = new Uint8Array(analyser.frequencyBinCount);
                analyser.getByteFrequencyData(fullData);
                for (let i = 0; i < barCount; i++) dataArray[i] = fullData[i % fullData.length];
            } else if (isPlaying) {
                const time = Date.now() * 0.005;
                for (let i = 0; i < barCount; i++) {
                    dataArray[i] = Math.max(15, Math.sin(time + i * 0.3) * 90 + Math.cos(time * 1.2 + i) * 70 + 90);
                }
            } else {
                for (let i = 0; i < barCount; i++) dataArray[i] = 8;
            }

            const currentColors = playlist[currentTrackIndex]?.themeColors || ["#6366f1", "#a855f7", "#ec4899"];

            for (let i = 0; i < barCount; i++) {
                const val = dataArray[i];
                const barHeight = Math.max(6, (val / 255) * h);
                const x = i * (barWidth + gap) + gap / 2;
                const y = h - barHeight;

                const grad = specCtx.createLinearGradient(0, h, 0, 0);
                grad.addColorStop(0, currentColors[0]);
                grad.addColorStop(0.5, currentColors[1]);
                grad.addColorStop(1, currentColors[2]);

                specCtx.fillStyle = grad;
                specCtx.beginPath();
                if (specCtx.roundRect) specCtx.roundRect(x, y, barWidth, barHeight, [4, 4, 0, 0]);
                else specCtx.rect(x, y, barWidth, barHeight);
                specCtx.fill();
            }
        }

        let bgTime = 0;
        function drawBgParticles() {
            requestAnimationFrame(drawBgParticles);
            bgTime += 0.01;
            const w = bgCanvas.width;
            const h = bgCanvas.height;
            if (w === 0 || h === 0) return;

            bgCtx.clearRect(0, 0, w, h);

            let bassVal = 0;
            let midVal = 0;

            if (analyser && isPlaying) {
                const freqData = new Uint8Array(analyser.frequencyBinCount);
                analyser.getByteFrequencyData(freqData);
                bassVal = (freqData[0] + freqData[1] + freqData[2] + freqData[3]) / 4;
                midVal = (freqData[4] + freqData[5] + freqData[6] + freqData[7]) / 4;
            } else if (isPlaying) {
                bassVal = (Math.sin(bgTime * 4) + 1) * 60;
                midVal = (Math.cos(bgTime * 3) + 1) * 40;
            }

            const bassScale = 1 + (bassVal / 255) * 0.35;
            const midScale = 1 + (midVal / 255) * 0.25;

            if (bgBlob1) bgBlob1.style.transform = `scale(${bassScale})`;
            if (bgBlob2) bgBlob2.style.transform = `scale(${midScale})`;
            if (bgBlob3) bgBlob3.style.transform = `scale(${bassScale * 0.9})`;

            if (vinylGlow) {
                const glowScale = 1 + (bassVal / 255) * 0.2;
                vinylGlow.style.transform = `scale(${glowScale})`;
            }

            if (!isPlaying) return;

            const currentColors = playlist[currentTrackIndex]?.themeColors || ["#6366f1", "#a855f7", "#ec4899"];

            for (let j = 0; j < 3; j++) {
                bgCtx.beginPath();
                bgCtx.moveTo(0, h / 2);
                const dynamicWaveHeight = 25 + (bassVal / 255) * (50 + j * 20);

                for (let x = 0; x <= w; x += 30) {
                    const y = Math.sin(x * 0.003 + bgTime + j) * dynamicWaveHeight + (h / 2) + Math.cos(bgTime * 0.5) * 30;
                    bgCtx.lineTo(x, y);
                }
                bgCtx.strokeStyle = currentColors[j % currentColors.length];
                bgCtx.lineWidth = 2 + j;
                bgCtx.globalAlpha = 0.15 + (bassVal / 255) * 0.2;
                bgCtx.stroke();
            }
        }

        function loadTrack(index) {
            const track = playlist[index];
            songTitle.textContent = track.title;
            artistName.textContent = track.artist;

            const colors = track.themeColors || ["#6366f1", "#a855f7", "#ec4899"];
            vinylGlow.style.background = `linear-gradient(to right, ${colors[0]}, ${colors[1]}, ${colors[2]})`;
            bgBlob1.style.backgroundColor = colors[0];
            bgBlob2.style.backgroundColor = colors[1];
            bgBlob3.style.backgroundColor = colors[2];

            audio.src = track.src;
            audio.currentTime = 0;
            progressBar.value = 0;
            currentTimeEl.textContent = "0:00";
            totalTimeEl.textContent = "0:00";
            renderPlaylist();
        }

        function formatTime(secs) {
            if (isNaN(secs)) return "0:00";
            const m = Math.floor(secs / 60);
            const s = Math.floor(secs % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        function togglePlay() {
            initAudioContext();
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();

            if (isPlaying) {
                audio.pause();
                isPlaying = false;
                playIcon.className = "fa-solid fa-play ml-0.5";
                vinylDisk.classList.add('vinyl-paused');
            } else {
                audio.play().then(() => {
                    isPlaying = true;
                    playIcon.className = "fa-solid fa-pause";
                    vinylDisk.classList.remove('vinyl-paused');
                }).catch(err => console.log(err));
            }
        }

        audio.addEventListener('timeupdate', () => {
            if (audio.duration) {
                const pct = (audio.currentTime / audio.duration) * 100;
                progressBar.value = pct;
                currentTimeEl.textContent = formatTime(audio.currentTime);
                totalTimeEl.textContent = formatTime(audio.duration);
            }
        });

        audio.addEventListener('ended', () => {
            if (isRepeat) {
                audio.currentTime = 0;
                audio.play();
            } else {
                nextTrack();
            }
        });

        function nextTrack() {
            if (isShuffle) currentTrackIndex = Math.floor(Math.random() * playlist.length);
            else currentTrackIndex = (currentTrackIndex + 1) % playlist.length;
            loadTrack(currentTrackIndex);
            if (isPlaying) audio.play();
        }

        function prevTrack() {
            currentTrackIndex = (currentTrackIndex - 1 + playlist.length) % playlist.length;
            loadTrack(currentTrackIndex);
            if (isPlaying) audio.play();
        }

        progressBar.addEventListener('input', (e) => {
            if (audio.duration) {
                const targetTime = (e.target.value / 100) * audio.duration;
                audio.currentTime = targetTime;
                currentTimeEl.textContent = formatTime(targetTime);
            }
        });

        volumeBar.addEventListener('input', (e) => {
            const val = e.target.value;
            audio.volume = val / 100;
            volumeIcon.className = val == 0 ? "fa-solid fa-volume-xmark text-xs" : val < 50 ? "fa-solid fa-volume-low text-xs" : "fa-solid fa-volume-high text-xs";
        });

        muteBtn.addEventListener('click', () => {
            isMuted = !isMuted;
            audio.muted = isMuted;
            volumeIcon.className = isMuted ? "fa-solid fa-volume-xmark text-xs" : volumeBar.value < 50 ? "fa-solid fa-volume-low text-xs" : "fa-solid fa-volume-high text-xs";
        });

        shuffleBtn.addEventListener('click', () => {
            isShuffle = !isShuffle;
            shuffleBtn.classList.toggle('text-indigo-600', isShuffle);
            shuffleBtn.classList.toggle('dark:text-indigo-400', isShuffle);
            shuffleBtn.classList.toggle('text-zinc-400', !isShuffle);
        });

        repeatBtn.addEventListener('click', () => {
            isRepeat = !isRepeat;
            repeatBtn.classList.toggle('text-indigo-600', isRepeat);
            repeatBtn.classList.toggle('dark:text-indigo-400', isRepeat);
            repeatBtn.classList.toggle('text-zinc-400', !isRepeat);
        });

        function handleFiles(files) {
            if (!files || files.length === 0) return;
            let firstUploadedIndex = playlist.length;
            const colorPalettes = [
                ["#10b981", "#14b8a6", "#6366f1"],
                ["#f43f5e", "#8b5cf6", "#06b6d4"],
                ["#ec4899", "#f59e0b", "#10b981"]
            ];

            Array.from(files).forEach((file, idx) => {
                const objectUrl = URL.createObjectURL(file);
                const fileName = file.name.replace(/\.[^/.]+$/, "");
                playlist.push({
                    title: fileName,
                    artist: "本地歌曲",
                    src: objectUrl,
                    themeColors: colorPalettes[idx % colorPalettes.length]
                });
            });

            renderPlaylist();
            currentTrackIndex = firstUploadedIndex;
            loadTrack(currentTrackIndex);
            initAudioContext();
            audio.play().then(() => {
                isPlaying = true;
                playIcon.className = "fa-solid fa-pause";
                vinylDisk.classList.remove('vinyl-paused');
            }).catch(() => {});
        }

        uploadBtn.addEventListener('click', () => audioFileInput.click());
        drawerUploadBtn.addEventListener('click', () => audioFileInput.click());
        audioFileInput.addEventListener('change', (e) => handleFiles(e.target.files));

        window.addEventListener('dragover', (e) => e.preventDefault());
        window.addEventListener('drop', (e) => {
            e.preventDefault();
            if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                handleFiles(e.dataTransfer.files);
            }
        });

        function renderPlaylist() {
            playlistContainer.innerHTML = '';
            playlist.forEach((item, idx) => {
                const active = idx === currentTrackIndex;
                const row = document.createElement('div');
                row.className = `flex items-center justify-between p-2.5 rounded-xl cursor-pointer transition-all ${
                    active 
                    ? 'bg-indigo-500/15 dark:bg-indigo-500/20 text-indigo-600 dark:text-indigo-300 font-semibold border border-indigo-500/30' 
                    : 'hover:bg-black/5 dark:hover:bg-white/10 text-zinc-700 dark:text-zinc-300'
                }`;
                row.innerHTML = `
                    <div class="flex items-center space-x-3 truncate">
                        <div class="w-7 h-7 rounded-lg bg-black/5 dark:bg-white/10 flex items-center justify-center text-xs">
                            <i class="fa-solid ${active ? 'fa-compact-disc text-indigo-500 dark:text-indigo-400 animate-spin' : 'fa-music opacity-60'}"></i>
                        </div>
                        <div class="truncate">
                            <div class="text-xs truncate">${item.title}</div>
                            <div class="text-[10px] opacity-60 truncate">${item.artist}</div>
                        </div>
                    </div>
                    ${active ? '<i class="fa-solid fa-chart-simple text-xs text-indigo-500 dark:text-indigo-400 mr-1 animate-pulse"></i>' : ''}
                `;
                row.addEventListener('click', () => {
                    currentTrackIndex = idx;
                    loadTrack(currentTrackIndex);
                    initAudioContext();
                    audio.play().then(() => {
                        isPlaying = true;
                        playIcon.className = "fa-solid fa-pause";
                        vinylDisk.classList.remove('vinyl-paused');
                    });
                });
                playlistContainer.appendChild(row);
            });
        }

        playBtn.addEventListener('click', togglePlay);
        nextBtn.addEventListener('click', nextTrack);
        prevBtn.addEventListener('click', prevTrack);

        loadTrack(0);
        drawSpectrum();
        drawBgParticles();
    </script>
</body>
</html>
