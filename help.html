<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>使用說明 - 雲端動態音樂播放器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .glass-card { backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%); }
    </style>
</head>
<body class="bg-slate-100 dark:bg-zinc-950 text-slate-900 dark:text-slate-100 min-h-screen flex items-center justify-center p-4 font-sans select-none">

    <div class="absolute inset-0 pointer-events-none overflow-hidden">
        <div class="absolute top-1/4 left-10 w-96 h-96 bg-indigo-500/20 dark:bg-indigo-600/30 rounded-full blur-[80px]"></div>
    </div>

    <div class="relative z-10 w-full max-w-lg p-8 rounded-3xl shadow-2xl border border-white/60 dark:border-white/10 glass-card bg-white/70 dark:bg-zinc-900/70">
        <div class="flex items-center justify-between mb-6">
            <div class="flex items-center space-x-2">
                <div class="w-3 h-3 rounded-full bg-red-500"></div>
                <div class="w-3 h-3 rounded-full bg-amber-400"></div>
                <div class="w-3 h-3 rounded-full bg-emerald-500"></div>
            </div>
            <span id="welcomeUser" class="text-xs font-medium text-indigo-500 dark:text-indigo-400"></span>
        </div>

        <h1 class="text-2xl font-bold tracking-tight mb-4 flex items-center gap-2">
            <i class="fa-solid fa-circle-info text-indigo-500"></i> 快速使用指南
        </h1>

        <div class="space-y-3 text-sm text-zinc-600 dark:text-zinc-300 mb-8">
            <div class="flex items-start gap-3 p-3 rounded-xl bg-black/5 dark:bg-white/5">
                <i class="fa-solid fa-cloud-arrow-up text-indigo-500 mt-1"></i>
                <div>
                    <strong class="text-zinc-800 dark:text-zinc-100 block mb-0.5">獨立上傳音樂</strong>
                    每個帳號擁有獨立的資料庫，您上傳的 MP3 僅會保存在您當前帳號中。
                </div>
            </div>
            <div class="flex items-start gap-3 p-3 rounded-xl bg-black/5 dark:bg-white/5">
                <i class="fa-solid fa-compact-disc text-purple-500 mt-1"></i>
                <div>
                    <strong class="text-zinc-800 dark:text-zinc-100 block mb-0.5">動態視覺頻譜</strong>
                    播放音樂時會自動產生即時聲頻特效與動態背景光暈。
                </div>
            </div>
            <div class="flex items-start gap-3 p-3 rounded-xl bg-black/5 dark:bg-white/5">
                <i class="fa-solid fa-shuffle text-pink-500 mt-1"></i>
                <div>
                    <strong class="text-zinc-800 dark:text-zinc-100 block mb-0.5">狀態自動記憶</strong>
                    播到哪裡、音量大小及循環設定都會自動儲存。
                </div>
            </div>
        </div>

        <div class="flex gap-3">
            <button onclick="handleLogout()" class="px-5 py-3 rounded-xl bg-zinc-200 dark:bg-zinc-800 hover:opacity-80 font-medium text-xs transition-all">
                登出帳號
            </button>
            <button onclick="goToPlayer()" class="flex-1 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-medium text-sm shadow-lg shadow-indigo-500/30 transition-all hover:scale-[1.01]">
                開始體驗音樂播放器 <i class="fa-solid fa-arrow-right ml-1"></i>
            </button>
        </div>
    </div>

    <script>
        const currentUser = localStorage.getItem('aura_current_user');
        if (!currentUser) {
            window.location.href = 'index.html';
        } else {
            document.getElementById('welcomeUser').textContent = `目前登入：${currentUser}`;
        }

        function goToPlayer() {
            window.location.href = 'player.html';
        }

        function handleLogout() {
            localStorage.removeItem('aura_current_user');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
