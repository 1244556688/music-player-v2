<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>使用說明 - 雲端動態音樂播放器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .glass-card { backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%); }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: rgba(150, 150, 150, 0.3); border-radius: 9999px; }
    </style>
</head>
<body class="bg-slate-100 dark:bg-zinc-950 text-slate-900 dark:text-slate-100 min-h-screen flex items-center justify-center p-4 font-sans select-none">

    <div class="absolute inset-0 pointer-events-none overflow-hidden">
        <div class="absolute top-1/4 left-10 w-96 h-96 bg-indigo-500/20 dark:bg-indigo-600/30 rounded-full blur-[80px]"></div>
    </div>

    <div class="relative z-10 w-full max-w-lg p-6 sm:p-8 rounded-3xl shadow-2xl border border-white/60 dark:border-white/10 glass-card bg-white/70 dark:bg-zinc-900/70 max-h-[90vh] overflow-y-auto">
        <div class="flex items-center justify-between mb-4">
            <div class="flex items-center space-x-2">
                <div class="w-3 h-3 rounded-full bg-red-500"></div>
                <div class="w-3 h-3 rounded-full bg-amber-400"></div>
                <div class="w-3 h-3 rounded-full bg-emerald-500"></div>
            </div>
            <span id="welcomeUser" class="text-xs font-medium text-indigo-500 dark:text-indigo-400"></span>
        </div>

        <h1 class="text-xl sm:text-2xl font-bold tracking-tight mb-3 flex items-center gap-2">
            <i class="fa-solid fa-music text-indigo-500"></i> 音樂播放器功能簡介
        </h1>

        <!-- 路人視角：直覺的功能清單 -->
        <div class="space-y-3 text-xs sm:text-sm text-zinc-600 dark:text-zinc-300 mb-6">
            <div class="flex items-start gap-3 p-3 rounded-xl bg-black/5 dark:bg-white/5">
                <i class="fa-solid fa-user-shield text-indigo-500 mt-1"></i>
                <div>
                    <strong class="text-zinc-800 dark:text-zinc-100 block mb-0.5">專屬帳號管理</strong>
                    可以註冊自己的帳號並登入登出，每個人的歌單和設定都是獨立分開的。
                </div>
            </div>

            <div class="flex items-start gap-3 p-3 rounded-xl bg-black/5 dark:bg-white/5">
                <i class="fa-solid fa-cloud-arrow-up text-purple-500 mt-1"></i>
                <div>
                    <strong class="text-zinc-800 dark:text-zinc-100 block mb-0.5">上傳自己的音樂</strong>
                    隨時把手邊喜歡的 MP3 歌曲上傳上來，建立自己的專屬播放清單。
                </div>
            </div>

            <div class="flex items-start gap-3 p-3 rounded-xl bg-black/5 dark:bg-white/5">
                <i class="fa-solid fa-compact-disc text-pink-500 mt-1"></i>
                <div>
                    <strong class="text-zinc-800 dark:text-zinc-100 block mb-0.5">動態視覺效果</strong>
                    播音樂時，背景的光暈跟聲頻頻譜會跟著節奏一起動，很有氛圍感。
                </div>
            </div>

            <div class="flex items-start gap-3 p-3 rounded-xl bg-black/5 dark:bg-white/5">
                <i class="fa-solid fa-shuffle text-emerald-500 mt-1"></i>
                <div>
                    <strong class="text-zinc-800 dark:text-zinc-100 block mb-0.5">便利的播放控制</strong>
                    支援隨機播放、單曲循環、音量調整，關掉頁面也會自動記住上次聽到哪裡。
                </div>
            </div>
        </div>

        <!-- 按鈕區 -->
        <div class="flex gap-3">
            <button onclick="handleLogout()" class="px-4 py-3 rounded-xl bg-zinc-200 dark:bg-zinc-800 hover:opacity-80 font-medium text-xs transition-all">
                登出帳號
            </button>
            <button onclick="goToPlayer()" class="flex-1 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-medium text-sm shadow-lg shadow-indigo-500/30 transition-all hover:scale-[1.01]">
                開始體驗音樂播放器 <i class="fa-solid fa-arrow-right ml-1"></i>
            </button>
        </div>
    </div>

    <script>
        const currentUser = localStorage.getItem('aura_current_user');
        if (!currentUser) {
            window.location.href = 'index.html';
        } else {
            document.getElementById('welcomeUser').textContent = `目前登入：${currentUser}`;
        }

        function goToPlayer() {
            window.location.href = 'loading.html';
        }

        function handleLogout() {
            localStorage.removeItem('aura_current_user');
            window.location.href = 'loading.html';
        }
    </script>
</body>
</html>
