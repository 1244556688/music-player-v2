<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura Ambient Player - 登入與註冊</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { 
                extend: { 
                    boxShadow: {
                        'glass': '0 8px 32px 0 rgba(0, 0, 0, 0.3)',
                        'glass-light': '0 8px 32px 0 rgba(31, 38, 135, 0.15)'
                    }
                } 
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .gpu-accelerated { transform: translateZ(0); backface-visibility: hidden; perspective: 1000px; }
        .glass-card { 
            backdrop-filter: blur(25px) saturate(200%); 
            -webkit-backdrop-filter: blur(25px) saturate(200%); 
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-[#0f0f13] text-slate-900 dark:text-slate-100 min-h-screen flex items-center justify-center p-4 font-sans relative overflow-hidden select-none">

    <div class="fixed inset-0 pointer-events-none z-0 overflow-hidden gpu-accelerated">
        <div class="absolute -top-32 -left-32 w-[30rem] h-[30rem] bg-indigo-400/40 dark:bg-indigo-600/30 rounded-full blur-[80px]"></div>
        <div class="absolute top-1/2 -right-32 w-[35rem] h-[35rem] bg-cyan-400/30 dark:bg-purple-600/30 rounded-full blur-[90px]"></div>
        <div class="absolute -bottom-40 left-1/4 w-[40rem] h-[40rem] bg-pink-400/30 dark:bg-pink-700/20 rounded-full blur-[100px]"></div>
    </div>

    <div class="relative z-10 w-full max-w-sm p-8 rounded-[32px] glass-card bg-white/70 dark:bg-[#1e1e24]/80 border border-white/50 dark:border-white/10 text-zinc-800 dark:text-zinc-100 shadow-glass-light dark:shadow-glass">
        
        <div class="w-14 h-14 rounded-2xl bg-indigo-100 dark:bg-indigo-500/20 flex items-center justify-center mb-6 text-indigo-600 dark:text-indigo-400 text-2xl border border-indigo-200 dark:border-indigo-500/30 shadow-inner">
            <i class="fa-solid fa-fingerprint"></i>
        </div>
        
        <div class="flex items-end justify-between mb-6">
            <div>
                <h2 id="authCardTitle" class="text-2xl font-bold tracking-tight">歡迎回來</h2>
                <p id="authCardSubtitle" class="text-xs text-zinc-500 dark:text-zinc-400 mt-1">請登入帳號以進入播放器</p>
            </div>
            <button type="button" id="switchAuthModeBtn" class="text-xs text-indigo-600 dark:text-indigo-400 font-semibold hover:underline mb-1">
                建立新帳號
            </button>
        </div>

        <form id="authForm" class="space-y-4" onsubmit="handleAuthSubmit(event)">
            <div>
                <label class="block text-xs text-zinc-600 dark:text-zinc-300 font-medium mb-1.5 ml-1">使用者名稱</label>
                <input type="text" id="usernameInput" required placeholder="例如：Justin" class="w-full px-4 py-3 text-sm rounded-xl bg-white/50 dark:bg-black/30 border border-white/60 dark:border-white/10 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 transition-all">
            </div>
            <div>
                <label class="block text-xs text-zinc-600 dark:text-zinc-300 font-medium mb-1.5 ml-1">密碼</label>
                <input type="password" id="passwordInput" required placeholder="••••••••" class="w-full px-4 py-3 text-sm rounded-xl bg-white/50 dark:bg-black/30 border border-white/60 dark:border-white/10 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 transition-all">
            </div>
            <div id="confirmPasswordContainer" class="hidden">
                <label class="block text-xs text-zinc-600 dark:text-zinc-300 font-medium mb-1.5 ml-1">確認密碼</label>
                <input type="password" id="confirmPasswordInput" placeholder="••••••••" class="w-full px-4 py-3 text-sm rounded-xl bg-white/50 dark:bg-black/30 border border-white/60 dark:border-white/10 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 transition-all">
            </div>

            <div id="authErrorMsg" class="text-xs text-red-500 hidden font-medium ml-1"></div>

            <div class="pt-2 space-y-3">
                <button type="submit" id="authSubmitBtn" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-sm font-semibold transition-all shadow-lg shadow-indigo-500/25 active:scale-[0.98]">
                    立即登入
                </button>
                <button type="button" onclick="loginAsGuest()" class="w-full py-3 bg-white/50 dark:bg-white/5 hover:bg-white/80 dark:hover:bg-white/10 border border-black/5 dark:border-white/5 text-zinc-700 dark:text-zinc-300 rounded-xl text-sm font-medium transition-all active:scale-[0.98]">
                    以訪客身分繼續
                </button>
            </div>
        </form>
    </div>

    <script>
        let isRegisterMode = false;

        const authCardTitle = document.getElementById('authCardTitle');
        const authCardSubtitle = document.getElementById('authCardSubtitle');
        const switchAuthModeBtn = document.getElementById('switchAuthModeBtn');
        const authSubmitBtn = document.getElementById('authSubmitBtn');
        const confirmPasswordContainer = document.getElementById('confirmPasswordContainer');
        const confirmPasswordInput = document.getElementById('confirmPasswordInput');
        const authErrorMsg = document.getElementById('authErrorMsg');

        // 切換 登入 / 註冊 模式
        switchAuthModeBtn.addEventListener('click', () => {
            isRegisterMode = !isRegisterMode;
            authErrorMsg.classList.add('hidden'); // 切換模式時清除錯誤訊息
            
            if (isRegisterMode) {
                authCardTitle.textContent = "建立帳號";
                authCardSubtitle.textContent = "註冊新帳號以儲存偏好";
                authSubmitBtn.textContent = "立即註冊";
                switchAuthModeBtn.textContent = "返回登入";
                confirmPasswordContainer.classList.remove('hidden');
                confirmPasswordInput.setAttribute('required', 'true');
            } else {
                authCardTitle.textContent = "歡迎回來";
                authCardSubtitle.textContent = "請登入帳號以進入播放器";
                authSubmitBtn.textContent = "立即登入";
                switchAuthModeBtn.textContent = "建立新帳號";
                confirmPasswordContainer.classList.add('hidden');
                confirmPasswordInput.removeAttribute('required');
            }
        });

        // 處理登入或註冊
        function handleAuthSubmit(event) {
            event.preventDefault();
            const username = document.getElementById('usernameInput').value.trim();
            const password = document.getElementById('passwordInput').value.trim();

            if (isRegisterMode) {
                // 【註冊模式】
                const confirmPassword = confirmPasswordInput.value.trim();
                if (password !== confirmPassword) {
                    authErrorMsg.textContent = "兩次輸入的密碼不一致！";
                    authErrorMsg.classList.remove('hidden');
                    return;
                }
                
                // 檢查帳號是否已經存在
                if (localStorage.getItem('aura_user_' + username)) {
                    authErrorMsg.textContent = "這個帳號已經被註冊過了喔！";
                    authErrorMsg.classList.remove('hidden');
                    return;
                }

                // 儲存密碼完成註冊
                localStorage.setItem('aura_user_' + username, password);
                alert("註冊成功！請點擊「確認」並重新登入帳號。");
                
                // 註冊成功後自動切換回登入模式，清空密碼欄位
                document.getElementById('passwordInput').value = '';
                confirmPasswordInput.value = '';
                switchAuthModeBtn.click(); 
                return; 

            } else {
                // 【登入模式】
                const savedPassword = localStorage.getItem('aura_user_' + username);
                
                // 如果找不到這個帳號
                if (!savedPassword) {
                    authErrorMsg.textContent = "找不到此帳號，請先建立新帳號！";
                    authErrorMsg.classList.remove('hidden');
                    return;
                }
                
                // 如果密碼錯誤
                if (savedPassword !== password) {
                    authErrorMsg.textContent = "密碼錯誤！";
                    authErrorMsg.classList.remove('hidden');
                    return;
                }
            }

            // 登入成功，將用戶名存入 localStorage 並跳轉到播放器頁面
            // ⚠️ 注意：這裡的跳轉目標是 help.html，請確保這是你播放器的網頁名稱
            localStorage.setItem('aura_current_user', username);
            window.location.href = 'help.html'; 
        }

        // 訪客登入
        function loginAsGuest() {
            localStorage.setItem('aura_current_user', '訪客');
            window.location.href = 'help.html'; // 統一跳轉到同一個播放器頁面
        }
    </script>
</body>
</html>
