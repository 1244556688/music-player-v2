<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登入 - 雲端動態音樂播放器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .glass-card { backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%); }
    </style>
</head>
<body class="bg-slate-100 dark:bg-zinc-950 text-slate-900 dark:text-slate-100 min-h-screen flex items-center justify-center p-4 font-sans select-none">

    <div class="absolute inset-0 pointer-events-none overflow-hidden">
        <div class="absolute -top-20 -left-20 w-96 h-96 bg-indigo-500/20 dark:bg-indigo-600/30 rounded-full blur-[80px]"></div>
        <div class="absolute bottom-0 right-0 w-96 h-96 bg-purple-500/20 dark:bg-purple-600/30 rounded-full blur-[80px]"></div>
    </div>

    <div class="relative z-10 w-full max-w-sm p-8 rounded-3xl shadow-2xl border border-white/60 dark:border-white/10 glass-card bg-white/70 dark:bg-zinc-900/70 text-center">
        <div class="w-16 h-16 mx-auto mb-4 rounded-2xl bg-gradient-to-tr from-indigo-600 to-pink-500 flex items-center justify-center shadow-lg text-white text-2xl">
            <i class="fa-solid fa-music"></i>
        </div>
        
        <h1 class="text-2xl font-bold tracking-tight mb-1">音樂播放器</h1>
        <p class="text-xs text-zinc-500 dark:text-zinc-400 mb-6">請輸入您的帳號以載入專屬音樂庫</p>

        <form id="loginForm" class="space-y-4">
            <div class="relative">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-zinc-400">
                    <i class="fa-solid fa-user text-xs"></i>
                </span>
                <input type="text" id="usernameInput" required placeholder="例如: UserA 或 UserB" 
                    class="w-full pl-10 pr-4 py-3 rounded-xl bg-black/5 dark:bg-zinc-800/50 border border-black/10 dark:border-white/10 text-sm focus:outline-none focus:border-indigo-500 transition-colors">
            </div>

            <button type="submit" class="w-full py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-medium shadow-lg shadow-indigo-500/30 transition-all hover:scale-[1.02] active:scale-[0.98]">
                進入系統
            </button>
        </form>
    </div>

    <script>
        // 如果已經有登入紀錄，直接導向說明頁
        if (localStorage.getItem('aura_current_user')) {
            window.location.href = 'help.html';
        }

        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const username = document.getElementById('usernameInput').value.trim();
            if (username) {
                localStorage.setItem('aura_current_user', username);
                window.location.href = 'help.html'; // 導向說明頁
            }
        });
    </script>
</body>
</html>
