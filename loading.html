<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音訊核心初始化 - 雲端動態音樂播放器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'system-ui', '-apple-system', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- 引入 Google Fonts: Plus Jakarta Sans & 輕量圖示 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Syne:wght@500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* 隱藏滾動條 */
        body::-webkit-scrollbar { display: none; }
        body { -ms-overflow-style: none; scrollbar-width: none; }

        /* 高階背景星塵效果與雜訊 */
        .noise-overlay {
            position: fixed;
            inset: 0;
            z-index: 50;
            pointer-events: none;
            opacity: 0.025;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
        }

        /* 3D 景深與透視 */
        .perspective-container {
            perspective: 1200px;
        }

        /* 頂級流體緩動 */
        .fluid-ease {
            transition: all 1.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        /* 動態漸變背景軌道 */
        @keyframes float-orb-1 {
            0% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.15); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(0px, 0px) scale(1); }
        }
        @keyframes float-orb-2 {
            0% { transform: translate(0px, 0px) scale(1); }
            50% { transform: translate(-40px, 40px) scale(1.2); }
            100% { transform: translate(0px, 0px) scale(1); }
        }

        .animate-orb-1 {
            animation: float-orb-1 15s infinite ease-in-out;
        }
        .animate-orb-2 {
            animation: float-orb-2 18s infinite ease-in-out;
        }
    </style>
</head>
<body class="bg-[#030208] text-slate-100 min-h-[100dvh] flex items-center justify-center p-4 overflow-hidden relative font-sans select-none perspective-container">

    <!-- 頂級網格與雜訊紋理 -->
    <div class="noise-overlay"></div>
    
    <!-- 奢華背景流體光暈 (Mesh Orbs) -->
    <div class="absolute inset-0 pointer-events-none overflow-hidden z-0">
        <div class="absolute -top-40 -left-40 w-[600px] h-[600px] bg-indigo-600/15 dark:bg-indigo-700/20 rounded-full blur-[120px] animate-orb-1"></div>
        <div class="absolute -bottom-40 -right-40 w-[600px] h-[600px] bg-purple-600/15 dark:bg-purple-700/20 rounded-full blur-[120px] animate-orb-2"></div>
    </div>

    <!-- 核心外層：Double-Bezel 雙層邊框精密嵌合架構 -->
    <div id="introCardShell" class="relative z-10 w-full max-w-md p-[3px] rounded-[2.5rem] bg-gradient-to-b from-white/10 to-white/[0.02] shadow-[0_32px_64px_-12px_rgba(0,0,0,0.9)] opacity-0 scale-[0.92] blur-md fluid-ease">
        <!-- 內層核心容器 -->
        <div class="relative w-full rounded-[calc(2.5rem-3px)] bg-zinc-950/80 backdrop-blur-3xl p-8 sm:p-10 flex flex-col items-center justify-center text-center overflow-hidden border border-black/50">
            
            <!-- 裝飾微標籤 (Eyebrow Badge) -->
            <div class="mb-8 opacity-0 translate-y-4 fluid-ease delay-100 flex items-center gap-1.5 px-3 py-1 rounded-full bg-white/[0.04] border border-white/[0.08]" id="badge">
                <span class="w-1.5 h-1.5 rounded-full bg-indigo-500 animate-pulse"></span>
                <span class="text-[9px] uppercase tracking-[0.25em] font-semibold text-zinc-400">AURA AUDIO ENGINE v2.0</span>
            </div>

            <!-- 音感動態核心區 (Canvas Kinetic Core) -->
            <div class="relative w-44 h-44 mb-10 flex items-center justify-center">
                <!-- 呼吸光暈圈 -->
                <div class="absolute inset-0 rounded-full bg-indigo-500/10 dark:bg-indigo-500/15 blur-2xl animate-pulse"></div>
                <!-- 內層圓環 Double-Bezel -->
                <div class="absolute w-[160px] h-[160px] rounded-full border border-white/5 bg-zinc-900/40 backdrop-blur-md flex items-center justify-center">
                    <div class="absolute w-[130px] h-[130px] rounded-full border border-white/10 bg-black/60 shadow-[inset_0_2px_12px_rgba(255,255,255,0.06)] flex items-center justify-center overflow-hidden">
                        <!-- 動態粒子頻譜畫布 -->
                        <canvas id="coreCanvas" class="absolute inset-0 w-full h-full block"></canvas>
                        
                        <!-- 核心圖示 / 歌唱針頭 -->
                        <div class="relative z-10 text-white flex flex-col items-center">
                            <i id="centerIcon" class="fa-solid fa-compact-disc text-3xl text-indigo-400 transition-all duration-700 ease-out transform scale-100"></i>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 進度數字與狀態文字 -->
            <div class="w-full space-y-2 mb-6 z-10">
                <!-- 藝術級 Syne 字體進度百分比 -->
                <div class="text-4xl sm:text-5xl font-extrabold tracking-tight font-sans text-transparent bg-clip-text bg-gradient-to-r from-white via-zinc-200 to-zinc-400" style="font-family: 'Syne', sans-serif;" id="percentage">
                    00%
                </div>
                <!-- 狀態日誌 -->
                <div class="h-5 flex items-center justify-center">
                    <p id="statusLog" class="text-[11px] font-mono tracking-wider text-indigo-400/80 uppercase animate-pulse">
                        INIT_AUDIO_HARDWARE...
                    </p>
                </div>
            </div>

            <!-- 精密進度條 -->
            <div class="w-48 h-[2px] bg-white/5 rounded-full overflow-hidden relative mb-4">
                <div id="progressBar" class="absolute left-0 top-0 h-full w-0 bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 shadow-[0_0_12px_#6366f1] transition-all duration-100 ease-out"></div>
            </div>

            <!-- 裝飾微縮浮水印 -->
            <div class="text-[9px] font-mono text-zinc-600 tracking-wider">
                LOADING EXPERIENCE SYSTEMS
            </div>

        </div>
    </div>

    <script>
        // 確保已經登入，否則跳轉
        const currentUser = localStorage.getItem('aura_current_user');
        if (!currentUser) {
            window.location.href = 'index.html';
        }

        // 當頁面載入完成，啟動進場動畫
        document.addEventListener('DOMContentLoaded', () => {
            const shell = document.getElementById('introCardShell');
            const badge = document.getElementById('badge');
            
            // 延遲一點點，實現優雅的淡入上升 (Fluid Ease-out)
            setTimeout(() => {
                shell.classList.remove('opacity-0', 'scale-[0.92]', 'blur-md');
                shell.classList.add('opacity-100', 'scale-100', 'blur-0');
            }, 100);

            setTimeout(() => {
                badge.classList.remove('opacity-0', 'translate-y-4');
                badge.classList.add('opacity-100', 'translate-y-0');
            }, 300);

            startLoadingSequence();
            initCoreVisualizer();
        });

        // 模擬系統載入流程的精緻狀態組
        const loadStages = [
            { threshold: 10, text: "正在喚醒音訊核心..." },
            { threshold: 25, text: "載入資料庫並同步個人設定..." },
            { threshold: 45, text: "構建極簡動態玻璃視窗..." },
            { threshold: 65, text: "初始化 Web Audio DSP 頻譜儀..." },
            { threshold: 85, text: "正在渲染環繞聲場氛圍..." },
            { threshold: 95, text: "AURA 準備就緒..." },
            { threshold: 100, text: "系統啟動中..." }
        ];

        let progress = 0;
        let speedFactor = 1; // 隨進度調變畫布律動速度

        function startLoadingSequence() {
            const percentageText = document.getElementById('percentage');
            const statusLog = document.getElementById('statusLog');
            const progressBar = document.getElementById('progressBar');
            const centerIcon = document.getElementById('centerIcon');

            const interval = setInterval(() => {
                // 利用隨機數模擬真實網路或解碼載入波動，打造細節豐富的 haptic 質感
                const increment = Math.floor(Math.random() * 6) + 2; 
                progress = Math.min(progress + increment, 100);

                // 更新百分比與進度條
                percentageText.textContent = `${progress.toString().padStart(2, '0')}%`;
                progressBar.style.width = `${progress}%`;

                // 根據進度加快畫布波動速率 (Kinetic build-up)
                speedFactor = 1 + (progress / 50);

                // 動態轉盤圖示微旋轉與縮放，創造能量蓄積感
                centerIcon.style.transform = `rotate(${progress * 5.4}deg) scale(${1 + (progress * 0.002)})`;

                // 動態切換進度狀態日誌
                const currentStage = loadStages.find(stage => progress <= stage.threshold);
                if (currentStage && statusLog.textContent !== currentStage.text) {
                    statusLog.classList.add('opacity-0');
                    setTimeout(() => {
                        statusLog.textContent = currentStage.text;
                        statusLog.classList.remove('opacity-0');
                    }, 150);
                }

                if (progress >= 100) {
                    clearInterval(interval);
                    triggerExitSequence();
                }
            }, 120);
        }

        // 觸發奢華的劇院式退場動畫 (Theatre Exit Fade & Zoom)
        function triggerExitSequence() {
            const shell = document.getElementById('introCardShell');
            const centerIcon = document.getElementById('centerIcon');
            const percentageText = document.getElementById('percentage');
            
            setTimeout(() => {
                // 核心圖示向外猛烈擴散光芒效果
                centerIcon.classList.add('scale-[3.5]', 'opacity-0');
                percentageText.classList.add('scale-[1.1]', 'opacity-0', 'blur-sm');
                
                // 外層卡片擴張淡出
                shell.style.transition = "all 1s cubic-bezier(0.76, 0, 0.24, 1)";
                shell.classList.add('scale-[1.08]', 'opacity-0', 'blur-lg');

                // 閃光後完美跳轉
                setTimeout(() => {
                    window.location.href = 'player.html';
                }, 950);
            }, 400);
        }

        // 音感動態核心畫布引擎 (Procedural Vector Wave Core)
        function initCoreVisualizer() {
            const canvas = document.getElementById('coreCanvas');
            const ctx = canvas.getContext('2d');
            
            // 像素高解析適配 (Retina Ready)
            const dpr = window.devicePixelRatio || 1;
            const size = 130;
            canvas.width = size * dpr;
            canvas.height = size * dpr;
            ctx.scale(dpr, dpr);

            let phase = 0;

            function draw() {
                ctx.clearRect(0, 0, size, size);
                
                const centerX = size / 2;
                const centerY = size / 2;
                const baseRadius = 45;

                // 隨著載入進度，不斷增加波形幅度和色彩深度 (Kinetic Amplification)
                const currentAmp = 4 + (progress * 0.08); 
                phase += 0.04 * speedFactor;

                // 畫出多層交織波紋 (三條流體正弦圓環疊加)
                for (let k = 0; k < 3; k++) {
                    ctx.beginPath();
                    const waveCount = 5 + k; // 波數
                    const offsetPhase = phase + (k * Math.PI / 4);

                    for (let i = 0; i <= 180; i++) {
                        const angle = (i * 2) * Math.PI / 180;
                        // 正弦圓波調製
                        const radialOffset = Math.sin(angle * waveCount + offsetPhase) * currentAmp * (0.6 + k * 0.2);
                        const r = baseRadius + radialOffset;

                        const x = centerX + Math.cos(angle) * r;
                        const y = centerY + Math.sin(angle) * r;

                        if (i === 0) {
                            ctx.moveTo(x, y);
                        } else {
                            ctx.lineTo(x, y);
                        }
                    }

                    ctx.closePath();
                    
                    // 精緻色彩漸變 (與 AURA 主色相映)
                    if (k === 0) {
                        ctx.strokeStyle = `rgba(99, 102, 241, ${0.15 + (progress * 0.0035)})`; // Indigo
                    } else if (k === 1) {
                        ctx.strokeStyle = `rgba(168, 85, 247, ${0.1 + (progress * 0.0025)})`; // Purple
                    } else {
                        ctx.strokeStyle = `rgba(236, 72, 153, ${0.05 + (progress * 0.002)})`; // Pink
                    }
                    
                    ctx.lineWidth = 1.5;
                    ctx.shadowColor = 'rgba(99, 102, 241, 0.4)';
                    ctx.shadowBlur = progress * 0.1;
                    ctx.stroke();
                }

                requestAnimationFrame(draw);
            }

            draw();
        }
    </script>
</body>
</html>
